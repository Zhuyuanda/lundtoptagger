# ============================================================
# Data and output paths
# ============================================================
data:
  path_to_trainfiles: "/share/lustre/yzhu/dijet_data/data_dijet_part0_0.25percent/graphs_dijet_part0_0.25percent_ln_kT_cut_None_with_pt"
  path_to_save: "/share/lustre/yzhu/srjtest"
  model_name: "LundNet_dijet_ln_kT_cut_{ln_kT_cut}"
  adv_model_name: "adversarial"
  ln_kT_cut: null

  # Used only for reading JSON (harmless to keep)
  meanstd_json: "/share/lustre/yzhu/dijet_data/data_dijet_part0_0.25percent/slice_meanstd_part0.json"


# ============================================================
# Architecture and training
# ============================================================
architecture:
  batch_size: 4500
  test_size: 0.1
  learning_rate: 0.0004
  save_every_epoch: True

  n_epochs: 35
  choose_model: LundNet

  # adversarial settings
  do_combined_training: False
  num_gaussians: 20
  n_epochs_adv: 20
  lambda_parameter: 25
  loss_parameter: 1
  loss_weights: [1, 1]
  n_epochs_common: 200


# ============================================================
# Retraining
# ============================================================
retrain:
  flag: False
  path_to_ckpt: ""


# ============================================================
# Computing resources
# ============================================================
gpu: null
num_workers: 4
